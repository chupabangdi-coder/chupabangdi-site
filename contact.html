<section class="section-tight" style="padding-top:10px">
  <div class="contact-grid">
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thank-you.html">
      <input type="hidden" name="form-name" value="contact">
      <p style="display:none"><label>남기지 마세요<input name="bot-field"></label></p>
      <div class="form-field">
        <label>이름</label>
        <input type="text" name="name" required placeholder="이름을 입력해주세요">
      </div>
      <div class="form-field">
        <label>이메일</label>
        <input type="email" name="email" required placeholder="답변받으실 이메일 주소">
      </div>
      <div class="form-field">
        <label>전화번호</label>
        <input type="text" name="phone" placeholder="연락받으실 전화번호">
      </div>
      <div class="form-field">
        <label>문의 내용</label>
        <textarea name="message" placeholder="문의하실 내용을 자유롭게 작성해주세요"></textarea>
      </div>
      <button type="submit" class="btn btn-solid">문의 보내기</button>
    </form>
