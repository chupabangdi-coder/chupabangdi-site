<script>
  // 같은 세션에서 이미 인트로를 봤다면 바로 홈으로 이동
  if (sessionStorage.getItem('cbd_intro_seen')) {
    location.replace('home.html');
  } else {
    sessionStorage.setItem('cbd_intro_seen', '1');

</div>

<script>
  document.getElementById('skipBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    window.location.href = 'home.html';
  });

  var introVideo = document.getElementById('introVideo');
  var introCta = document.getElementById('introCta');
  var enterLink = document.getElementById('enterLink');
  var introStage = document.querySelector('.intro-stage');
  if (introVideo) {
    introVideo.addEventListener('ended', function () {
      if (introCta) introCta.classList.add('show');
      if (enterLink) enterLink.classList.add('enabled');
      if (introStage) introStage.classList.add('dim');
    });
  }
</script>
